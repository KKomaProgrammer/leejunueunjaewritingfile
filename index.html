<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>안내</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, #ffffff 0, #f5f7fb 45%, #edf1f7 100%);
    }

    main {
      width: min(100%, 520px);
      padding: 42px 34px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #e6eaf1;
      border-radius: 24px;
      box-shadow: 0 20px 55px rgba(25, 39, 75, 0.1);
      backdrop-filter: blur(16px);
    }

    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: grid;
      place-items: center;
      color: #64748b;
      background: #f1f5f9;
      border-radius: 20px;
    }

    p {
      margin: 0;
      font-size: clamp(17px, 4.5vw, 20px);
      font-weight: 650;
      line-height: 1.75;
      letter-spacing: -0.025em;
      text-wrap: balance;
      word-break: keep-all;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 24 24" fill="none">
        <path d="M6.75 2.75h7.5l3 3v15.5H6.75a2 2 0 0 1-2-2V4.75a2 2 0 0 1 2-2Z" fill="currentColor" opacity=".1"/>
        <path d="M14.25 2.75v3h3M12 9.5v4.25M12 17.25h.01M6.75 2.75h7.5l3 3v15.5H6.75a2 2 0 0 1-2-2V4.75a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p>작문 파일을 빈 파일로 잘못 올리고 시간이 지나서 다시 업로드를 못했어요. 죄송합니다...</p>
  </main>
</body>
</html>
